   * 空白（ASCII の空白類と全角空白）をすべて除き、前後の trim をする。

    var t = str(s).replace(/[ \t\n\v\f\r　]+/g, '');

      if (w.q !== p && w.q !== q) pool.push(makeParticular(subjectName, w.q));
    });
    // C. 別の前件 → Q（T.S 違反）
    g.warrants.forEach(function (w) { if (w.p !== p) pool.push(makeGeneral(w.p, q)); });
    // D. P → 別の後件（E.S 違反）
    g.warrants.forEach(function (w) { if (w.q !== q) pool.push(makeGeneral(p, w.q)); });
    // E. 反転 Q → P
    pool.push(makeGeneral(q, p));
    // F. 完全に別の warrant
    g.warrants.forEach(function (w) {
      if (w.p !== p && w.q !== q && w.p !== q && w.q !== p) pool.push(makeGeneral(w.p, w.q));
    });
    return pool;
  }

  /** 複合のダミー候補（PHP の build_dummy_candidate_pool_compound）。A〜G */
  function buildCompoundPool(subjectName, p, q, qp, g) {
    var pool = [];
    var exclude = [p, q, qp];
    // A. 主語置換
    g.subjects.forEach(function (s) {
      if (s.name === subjectName) return;
      [qp, q, p].forEach(function (pred) { pool.push(makeParticular(s.name, pred)); });
    });
    // B. 述語置換
    g.warrants.forEach(function (w) {
      if (exclude.indexOf(w.p) < 0) pool.push(makeParticular(subjectName, w.p));
      if (exclude.indexOf(w.q) < 0) pool.push(makeParticular(subjectName, w.q));
    });
    // C. 中項違反: alt → Q'
    g.warrants.forEach(function (w) {
      if (w.p !== q && w.p !== p) pool.push(makeGeneral(w.p, qp));
    });
    // D. 終項違反: Q → alt
    g.warrants.forEach(function (w) {
      if (w.q !== qp && w.q !== q) pool.push(makeGeneral(q, w.q));
    });
    // E. 下三角形の中項違反: alt → Q
    g.warrants.forEach(function (w) {
      if (w.p !== p && w.p !== q) pool.push(makeGeneral(w.p, q));
    });
    // F. 下三角形の終項違反: P → alt
    g.warrants.forEach(function (w) {
      if (w.q !== q && w.q !== p) pool.push(makeGeneral(p, w.q));
    });
    // G. 反転
    pool.push(makeGeneral(qp, q));
    pool.push(makeGeneral(q, p));
    pool.push(makeGeneral(qp, p));
    return pool;
  }

  /** 本文（form|text）の重複を除き、正解と同じ本文も除く（PHP の重複除去 + C6 の事前除外） */
  function dedupeAgainst(pool, excludeTexts) {
    var seen = {};
    excludeTexts.forEach(function (t) { seen[t] = true; });
    var out = [];
    pool.forEach(function (c) {
      var key = c.proposition_form + '|' + c.text;
      if (seen[key]) return;
      seen[key] = true;
      out.push(c);
    });
    return out;
  }

  /** 違反パターン別の層化抽出（PHP の stratified_sample）。particular と general を半分ずつ */
  function stratifiedSample(pool, maxSize, rng) {
    if (pool.length <= maxSize) return pool.slice();
    var by = { particular: [], general: [] };
    pool.forEach(function (c) { by[c.proposition_form].push(c); });
    var half = Math.ceil(maxSize / 2);
    var result = [];
    ['particular', 'general'].forEach(function (form) {
      rng.shuffle(by[form].slice()).slice(0, half).forEach(function (c) { result.push(c); });
    });
    if (result.length > maxSize) {
      rng.shuffle(result);
      result = result.slice(0, maxSize);
    }
    return result;
  }

  // ----- 判定の補助（キャッシュ付き）------------------------------------------

  /**
   * 生成 1 問ぶんの作業領域。mode ごとに、カードの署名（内容）に番号を振り、
   * 配置の判定結果をキャッシュする（PHP の eval_cache に相当）。
   */
  function newContext(mode) {
    return { mode: mode, sigIds: {}, sigCount: 0, cache: {} };
  }

  function sigOf(c) {
    return [c.proposition_form, c.subject_term, c.predicate_term, c.antecedent_term,
      c.consequent_term, c.role, c.correct_slot, c.semantic_valid]
      .map(str).join('|');
  }

  function sigId(ctx, c) {
    var s = sigOf(c);
    if (!ctx.sigIds.hasOwnProperty(s)) {
      ctx.sigIds[s] = ctx.sigCount++;
      if (ctx.sigCount >= CODE_SHIFT) throw new Error('署名の種類が多すぎます');
    }
    return ctx.sigIds[s];
  }

  /** 判定フラグ → 状態番号（単一は 4 bit、複合は 7 bit。PHP の $state 文字列に相当） */
  function stateCode(f, mode) {
    var bits = [f.p_s, f.t_s, f.e_s, f.m_s];
    if (mode === 'compound') bits = bits.concat([f.c_s, f.i_p_s, f.f_s]);
    var code = 0;
    bits.forEach(function (b) { code = code * 2 + (b ? 1 : 0); });
    return code;
  }

  /**
   * カバレッジ（PHP の enumerate_coverage）。全配置の状態の種類数を返す。
   * 単一は 3 スロット、複合は 5 スロットの全順列を見る。
   */
  function coverageSize(cards, ctx) {
    var mode = ctx.mode;
    var keys = mode === 'compound' ? TRIE.COMPOUND_SLOTS : TRIE.SINGLE_SLOTS;
    var n = cards.length;
    var k = keys.length;
    if (n < k) return 0;
    var sids = cards.map(function (c) { return sigId(ctx, c); });
    var used = [];
    var idxs = [];
    var seen = {};
    var count = 0;
    function rec(depth, code) {
      if (depth === k) {
        var st = ctx.cache[code];
        if (st === undefined) {
          var slots = {};
          for (var i = 0; i < k; i++) slots[keys[i]] = cards[idxs[i]].card_no;
          st = stateCode(TRIE.evaluate(mode, cards, slots), mode);
          ctx.cache[code] = st;
        }
        if (!seen[st]) { seen[st] = true; count++; }
        return;
      }
      for (var j = 0; j < n; j++) {
        if (used[j]) continue;
        used[j] = true;
        idxs[depth] = j;
        rec(depth + 1, code * CODE_SHIFT + sids[j]);
        used[j] = false;
      }
    }
    rec(0, 0);
    return count;
  }

  /**
   * 解の数（TRI.countValidSolutions と同じ値）。主語の一致で枝刈りした全列挙。
   * 生成器の内部で何度も呼ぶので、主語ごとに候補を絞ってから配置を数える。
   * 同じ値になることは tests/test_generator.js で TRI.countValidSolutions と突き合わせる。
   */
  function countUnique(cards, mode) {
    var subjKeys = mode === 'compound' ? ['final_claim', 'middle', 'lower_fact'] : ['claim', 'fact'];
    var restKeys = mode === 'compound' ? ['upper_warrant', 'lower_warrant'] : ['warrant'];
    var groups = {};
    cards.forEach(function (c, i) {
      var s = str(c.subject_term);
      if (s === '') return;
      (groups[s] = groups[s] || []).push(i);
    });
    var total = 0;
    var n = cards.length;
    Object.keys(groups).forEach(function (s) {
      var sub = groups[s];
      if (sub.length < subjKeys.length) return;
      var used = [];
      var slots = {};
      function restRec(depth) {
        if (depth === restKeys.length) {
          if (TRIE.isFullSatisfaction(TRIE.evaluate(mode, cards, slots), mode)) total++;
          return;
        }
        for (var j = 0; j < n; j++) {
          if (used[j]) continue;
          used[j] = true;
          slots[restKeys[depth]] = cards[j].card_no;
          restRec(depth + 1);
          used[j] = false;
        }
      }
      function subjRec(depth) {
        if (depth === subjKeys.length) {
          restRec(0);
          return;
        }
        sub.forEach(function (j) {
          if (used[j]) return;
          used[j] = true;
          slots[subjKeys[depth]] = cards[j].card_no;
          subjRec(depth + 1);
          used[j] = false;
        });
      }
      subjRec(0);
    });
    return total;
  }

  function withCardNo(c, no) {
    return Object.assign({}, c, { card_no: no });
  }

  /**
   * カバレッジ最大化の貪欲法（PHP の greedy_search）。
   * 一意性を保つ候補（countUnique が 1）だけを採る。改善する候補が無いときは、
   * 一意性を保つ先頭の候補を採る（PHP と同じ fallback）。どの候補も一意性を保てなければ null。
   */
  function greedySearch(pool, correct, count, ctx, startNo) {
    var selected = [];
    var remaining = pool.slice();
    var current = coverageSize(correct, ctx);
    var tried = 0;
    for (var k = 0; k < count; k++) {
      var next = startNo + k;
      var bestIdx = -1;
      var bestSize = current;
      for (var i = 0; i < remaining.length; i++) {
        tried++;
        var test = correct.concat(selected, [withCardNo(remaining[i], next)]);
        var size = coverageSize(test, ctx);
        if (size > bestSize && countUnique(test, ctx.mode) === 1) {
          bestSize = size;
          bestIdx = i;
        }
      }
      if (bestIdx < 0) {
        for (var m = 0; m < remaining.length; m++) {
          tried++;
          var t2 = correct.concat(selected, [withCardNo(remaining[m], next)]);
          if (countUnique(t2, ctx.mode) === 1) {
            bestIdx = m;
            bestSize = coverageSize(t2, ctx);
            break;
          }
        }
        if (bestIdx < 0) return null;
      }
      selected.push(withCardNo(remaining[bestIdx], next));
      remaining.splice(bestIdx, 1);
      current = bestSize;
    }
    return { dummies: selected, coverage: current, tried: tried };
  }

  // ----- 1 問の生成 -----------------------------------------------------------

  /**
   * 語彙からの 1 問生成（PHP の generate_from_library、単一・複合の両方）。
   *
   * @param {Object} opts {
   *   library: seed_*.json の配列（必須）,
   *   genre?: string       指定ジャンルだけから選ぶ（空なら実行可能なジャンルから乱択）,
   *   mode?: 'single'|'compound'（既定 single）,
   *   dummy_count?: 0〜5（既定 3）,
   *   seed?: number        乱数の種（省略時は乱数で決める。結果の _seed に入る）,
   *   level_no?, assignment_no?
   * }
   * @return {Object} sample_questions.json 互換の問題
   */
  function generateFromLibrary(opts) {
    opts = opts || {};
    var lib = normalizeLibrary(opts.library);
    var seed = newSeed(opts);
    var rng = makeRng(seed);
    var dummyCount = clampInt(opts.dummy_count, 0, 5, 3);
    var mode = opts.mode === 'compound' ? 'compound' : 'single';

    // 実行可能なジャンル（mode に合う主語と warrant の組がある）
    function feasible(g) {
      return g.subjects.some(function (s) {
        var app = applicableWarrants(g, s, lib.revSet);
        return mode === 'compound' ? findWarrantChains(app).length > 0 : app.length > 0;
      });
    }
    var g;
    var wantGenre = trimStr(opts.genre);
    if (wantGenre !== '') {
      g = lib.genres.filter(function (x) { return x.genre === wantGenre; })[0];
      if (!g) throw new Error("ジャンル '" + wantGenre + "' が語彙にない");
      if (!feasible(g)) throw new Error("ジャンル '" + wantGenre + "' に" + (mode === 'compound' ? '連鎖' : '適合') + "する組がない");
    } else {
      var ok = lib.genres.filter(feasible);
      if (ok.length === 0) throw new Error('実行可能なジャンルがない（mode=' + mode + '）');
      g = rng.pick(ok);
    }

    var result = null;
    var attempts = 0;
    while (!result && attempts < MAX_ATTEMPTS) {
      attempts++;
      var subject = rng.pick(g.subjects);
      var app = applicableWarrants(g, subject, lib.revSet);
      var ctx = newContext(mode);
      if (mode === 'single') {
        if (app.length === 0) continue;
        var w = rng.pick(app);
        var correct = buildTriplet(subject.name, w.p, w.q);
        var excl = correct.map(function (c) { return c.proposition_form + '|' + c.text; });
        var dummies = [];
        var info = null;
        if (dummyCount > 0) {
          var pool = stratifiedSample(dedupeAgainst(buildSinglePool(subject.name, w.p, w.q, g), excl),
            SINGLE_POOL_MAX, rng);
          var r = greedySearch(pool, correct, dummyCount, ctx, correct.length + 1);
          if (!r) continue;
          dummies = r.dummies;
          info = { pool_size: pool.length, tried: r.tried };
        }
        var cards = correct.concat(dummies);
        if (countUnique(cards, mode) !== 1) continue;
        var cov = dummyCount > 0 ? coverageSize(cards, ctx) : null;
        result = {
          name: sprintf('[自動生成・%s] %sは%s', g.genre, subject.name, w.q),
          questiontext: '与えられたカードから三角ロジックを組み立ててください。',
          mode: 'single',
          topic: g.genre + 'の特徴に関する論証',
          order_required: 0,
          level_no: orDefault(opts.level_no, null),
          assignment_no: orDefault(opts.assignment_no, null),
          cards: cards,
          _genre: g.genre,
          _subject: subject.name,
          _warrant: { p: w.p, q: w.q },
          coverage_info: dummyCount > 0 ? {
            final_states: cov, max_possible: 16, search_method: 'greedy',
            candidates_tried: info.tried, pool_size: info.pool_size
          } : null
        };
      } else {
        var chains = findWarrantChains(app);
        if (chains.length === 0) continue;
        var ch = rng.pick(chains);
        var w1 = ch[0], w2 = ch[1];
        var cq = buildQuintet(subject.name, w1.p, w1.q, w2.q);
        var excl2 = cq.map(function (c) { return c.proposition_form + '|' + c.text; });
        var dums = [];
        var info2 = null;
        if (dummyCount > 0) {
          var pool2 = stratifiedSample(
            dedupeAgainst(buildCompoundPool(subject.name, w1.p, w1.q, w2.q, g), excl2),
            COMPOUND_POOL_MAX, rng);
          var r2 = greedySearch(pool2, cq, dummyCount, ctx, cq.length + 1);
          if (!r2) continue;
          dums = r2.dummies;
          info2 = { pool_size: pool2.length, tried: r2.tried };
        }
        var cards2 = cq.concat(dums);
        if (countUnique(cards2, mode) !== 1) continue;
        var cov2 = dummyCount > 0 ? coverageSize(cards2, ctx) : null;
        result = {
          name: sprintf('[自動生成・%s/複合] %s', g.genre, subject.name),
          questiontext: '与えられたカードから複合三角ロジックを組み立ててください。',
          mode: 'compound',
          topic: g.genre + 'の特徴に関する論証',
          order_required: 0,
          level_no: orDefault(opts.level_no, null),
          assignment_no: orDefault(opts.assignment_no, null),
          cards: cards2,
          _genre: g.genre,
          _subject: subject.name,
          _warrant: { p: w1.p, q: w1.q },
          _warrant_upper: { p: w2.p, q: w2.q },
          coverage_info: dummyCount > 0 ? {
            final_states: cov2, max_possible: 128, search_method: 'greedy',
            candidates_tried: info2.tried, pool_size: info2.pool_size
          } : null
        };
      }
    }
    if (!result) {
      throw new Error('生成に失敗（' + MAX_ATTEMPTS + ' 回試行）: genre=' + g.genre + ' mode=' + mode);
    }
    result._seed = seed;
    result._attempts = attempts;
    return result;
  }

  /** 単純な %s 置換（PHP の sprintf 相当。%s を順に埋める） */
  function sprintf(fmt) {
    var args = Array.prototype.slice.call(arguments, 1);
    var i = 0;
    return fmt.replace(/%s/g, function () { return str(args[i++]); });
  }

  // ----- 手入力の単一問（generate_single）-------------------------------------

  /** ダミーの候補（PHP の build_dummies）。候補を作って shuffle し、先頭 count 個 */
  function buildDummies(subject, p, q, terms, count, rng) {
    var alt = terms.length ? terms : DEFAULT_ALT_TERMS;
    var cands = [];
    alt.forEach(function (a) {
      if (a === p || a === q) return;
      cands.push(makeParticular(subject, a));
    });
    alt.forEach(function (a) {
      if (a === p) return;
      cands.push(makeGeneral(a, q));
    });
    alt.forEach(function (a) {
      if (a === q) return;
      cands.push(makeGeneral(p, a));
    });
    cands.push(makeGeneral(q, p));
    return rng.shuffle(cands).slice(0, count);
  }

  /**
   * 主語・述語 Q・述語 P から 1 問（手入力モード）。PHP の generate_single。
   * 注意: PHP と同じく、ダミーは一意性を検査せずに選ぶ（解が複数になることがある）。
   */
  function generateSingle(opts) {
    opts = opts || {};
    var subject = trimStr(opts.subject);
    var predicateQ = trimStr(opts.predicate_q);
    var predicateP = trimStr(opts.predicate_p);
    if (subject === '' || predicateQ === '' || predicateP === '') {
      throw new Error('subject / predicate_q / predicate_p は必須');
    }
    var terms = (opts.dummy_terms || []).map(trimStr).filter(function (x) { return x !== ''; });
    var dummyCount = clampInt(opts.dummy_count, 0, 5, 3);
    var seed = newSeed(opts);
    var rng = makeRng(seed);

    var cards = buildTriplet(subject, predicateP, predicateQ);
    var dummies = buildDummies(subject, predicateP, predicateQ, terms, dummyCount, rng);
    dummies.forEach(function (d, i) {
      cards.push(withCardNo(d, 4 + i));
    });
    return {
      name: orDefault(opts.name, sprintf('[自動生成] %sは%s', subject, predicateQ)),
      questiontext: '与えられたカードから三角ロジックを組み立ててください。',
      mode: 'single',
      topic: orDefault(opts.topic, sprintf('%s に関する論証', subject)),
      order_required: 0,
      level_no: orDefault(opts.level_no, null),
      assignment_no: orDefault(opts.assignment_no, null),
      cards: cards,
      _seed: seed
    };
  }

  return {
    generateFromLibrary: generateFromLibrary,
    generateSingle: generateSingle,
    mulberry32: mulberry32,
    countUnique: countUnique,
    isReversible: isReversible,
    normalizeLibrary: normalizeLibrary
  };
})();

if (typeof module !== 'undefined' && module.exports) {
  module.exports = TRI_GEN;
}

</script>

<script>
// GAS のウェブアプリを呼ぶ薄い層。Content-Type を text/plain にして、ブラウザの事前確認（CORS）を避ける。
var API = (function () {
  var endpoint = (typeof MSK_CONFIG !== 'undefined' && MSK_CONFIG.endpoint) || '';
  function call(body) {
    if (!endpoint) return Promise.resolve({ ok: false, code: 'config', error: 'web/config.json の endpoint が空です' });
    return fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body),
      redirect: 'follow'
    }).then(function (r) { return r.json(); })
      .catch(function (e) { return { ok: false, code: 'network', error: '通信できませんでした（' + e.message + '）' }; });
  }
  return {
    login: function (idToken) { return call({ action: 'login', idToken: idToken }); },
    resume: function (session) { return call({ action: 'resume', session: session }); },
    check: function (session, lv, asg, slots) { return call({ action: 'check', session: session, lv: lv, asg: asg, slots: slots }); },
    log: function (session, events) { return call({ action: 'log', session: session, events: events }); },
    problemsLoad: function (session) { return call({ action: 'problems.load', session: session }); },
    problemsSave: function (session, problems, baseVersion) { return call({ action: 'problems.save', session: session, problems: problems, baseVersion: baseVersion }); },
    logsIndex: function (session) { return call({ action: 'logs.index', session: session }); },
    logsCsv: function (session, date, columns, withEmail) { return call({ action: 'logs.csv', session: session, date: date, columns: columns, withEmail: withEmail }); }
  };
})();
</script>

  var LS = {
    session: 'tri_session', progress: 'tri_progress', queue: 'tri_queue', page: 'tri_page_session'
  };
  var FLAG_LABEL = TRI.FLAG_LABELS, FLAG_HINT = TRI.FLAG_HINTS, FLAG_ORDER = TRI.FLAG_ORDER;
  var cfg = (typeof MSK_CONFIG !== 'undefined') ? MSK_CONFIG : {};
  var APP_VERSION = 'gas-triangle-1.0.0';
  var st = {
    session: null, email: '', userId: '', problems: [], version: '', flushMs: 5000, maxBatch: 100,
    cur: null, slots: {}, seq: 0, step: 0, trial: 0, attempt: '', pageSession: '', flushing: false, flushTimer: null
  };

  function $(id) { return document.getElementById(id); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できないときは諦める */ } }
  function uuid() {
    return 'xxxxxxxxxxxx4xxxyxxxxxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }
  function msg(text, isErr) {
    var el = $('global-msg');
    el.textContent = text || '';
    el.style.color = isErr ? '#ffd0d0' : '';
  }
  function show(id) {
    ['view-login', 'view-levels', 'view-problem'].forEach(function (v) { $(v).classList.toggle('hidden', v !== id); });
  }
  function pkey(p) { return p.lv * 1000 + p.asg; }
  function progress() { return lsGet(LS.progress, {}); }

  // ----- ログ（キューに溜めて、一定間隔でまとめて送る） -----
  function enqueue(ope1, extra) {
    st.seq += 1;
    var e = {
      event_id: st.pageSession + '-' + st.seq, page_session: st.pageSession, seq: st.seq,
      client_ts: Date.now(), app_version: APP_VERSION, task_set: st.version, ope1: ope1,
      lv: st.cur ? st.cur.lv : 0, asg: st.cur ? st.cur.asg : 0,
      questionid: st.cur ? pkey(st.cur) : 0, question_name: st.cur ? st.cur.name : '',
      attempt_id: st.attempt, session_uuid: st.attempt, trial: st.trial, step_no: st.step
    };
    Object.keys(extra || {}).forEach(function (k) { e[k] = extra[k]; });
    var q = lsGet(LS.queue, []);
    q.push(e);
    if (q.length > 3000) q = q.slice(q.length - 3000);
    lsSet(LS.queue, q);
    return e;
  }
  function flush() {
    if (st.flushing || !st.session) return;
    var q = lsGet(LS.queue, []);
    if (!q.length) return;
    st.flushing = true;
    var batch = q.slice(0, st.maxBatch);
    API.log(st.session, batch).then(function (r) {
      st.flushing = false;
      if (r && r.ok) {
        var ids = {};
        batch.forEach(function (e) { ids[e.event_id] = 1; });
        lsSet(LS.queue, lsGet(LS.queue, []).filter(function (e) { return !ids[e.event_id]; }));
      } else if (r && r.code === 'auth') {
        logout(true);
      }
    });
  }
  function startFlushing() {
    if (st.flushTimer) return;
    st.flushTimer = setInterval(flush, st.flushMs || 5000);
    window.addEventListener('pagehide', flush);
  }

  // ----- 画面 -----
  function renderLevels() {
    var prog = progress();
    var box = $('levels');
    box.innerHTML = '';
    if (!st.problems.length) {
      box.innerHTML = '<p>まだ問題がありません。先生に伝えてください。</p>';
      show('view-levels');   // 問題が無くても一覧の画面を出す（ログイン画面に残さない）
      return;
    }
    st.problems.forEach(function (p, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile' + (prog[pkey(p)] ? ' cleared' : '');
      b.innerHTML = '<div>レベル ' + p.lv + '　' + p.asg + '番</div><div class="sub"></div>';
      b.querySelector('.sub').textContent = (p.mode === 'compound' ? '複合三角形' : '単一三角形') + '　' + (p.topic || '');
      b.addEventListener('click', function () { openProblem(i); });
      box.appendChild(b);
    });
    show('view-levels');
  }

  function openProblem(i) {
    st.cur = st.problems[i];
    st.idx = i;
    st.slots = {};
    TRI.slotKeys(st.cur.mode).forEach(function (k) { st.slots[k] = 0; });
    st.step = 0; st.trial = 0; st.attempt = uuid();
    $('prob-title').textContent = 'レベル ' + st.cur.lv + '　' + st.cur.asg + '番　' + st.cur.name;
    $('prob-text').textContent = st.cur.questiontext;
    $('feedback').innerHTML = '';
    show('view-problem');
    renderStage();
    renderPalette();
    enqueue('PROB_BEGIN');
    window.scrollTo(0, 0);
  }

  function slotLabel(mode, k) { return TRI.SLOT_LABELS[k] || k; }

  function renderStage() {
    var mode = st.cur.mode;
    var stage = $('stage');
    // 配置の形（単一は 3 頂点、複合は 5 頂点の 3 段）
    var layout = mode === 'compound'
      ? [['final_claim'], ['middle', 'upper_warrant'], ['lower_fact', 'lower_warrant']]
      : [['claim'], ['fact', 'warrant']];
    stage.innerHTML = '';
    layout.forEach(function (keys) {
      var row = document.createElement('div');
      row.className = 'row';
      keys.forEach(function (k) { row.appendChild(makeSlot(k)); });
      stage.appendChild(row);
    });
  }

  function makeSlot(k) {
    var el = document.createElement('div');
    el.className = 'slot';
    el.dataset.slot = k;
    var lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = slotLabel(st.cur.mode, k);
    el.appendChild(lab);
    var no = st.slots[k];
    if (no) {
      var c = cardOf(no);
      el.appendChild(cardEl(c, true));
      el.classList.add('filled');
    } else {
      var ph = document.createElement('span');
      ph.textContent = 'カードをここに置く';
      ph.style.opacity = '.6';
      el.appendChild(ph);
    }
    el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('over'); });
    el.addEventListener('dragleave', function () { el.classList.remove('over'); });
    el.addEventListener('drop', function (e) {
      e.preventDefault(); el.classList.remove('over');
      var no2 = parseInt(e.dataTransfer.getData('text/plain'), 10);
      if (no2) place(no2, k);
    });
    el.addEventListener('click', function () {
      if (st.selected) { place(st.selected, k); st.selected = 0; }
      else if (no) { remove(k); }
    });
    return el;
  }

  function cardOf(no) {
    for (var i = 0; i < st.cur.cards.length; i++) if (st.cur.cards[i].card_no === no) return st.cur.cards[i];
    return { card_no: no, text: '?' };
  }

  function cardEl(c, inSlot) {
    var d = document.createElement('div');
    d.className = 'card';
    d.textContent = c.text;
    d.dataset.no = c.card_no;
    if (!inSlot) {
      d.draggable = true;
      d.addEventListener('dragstart', function (e) {
        e.dataTransfer.setData('text/plain', String(c.card_no));
        d.classList.add('dragging');
      });
      d.addEventListener('dragend', function () { d.classList.remove('dragging'); });
      d.addEventListener('click', function (e) {
        e.stopPropagation();
        st.selected = st.selected === c.card_no ? 0 : c.card_no;
        renderPalette();
      });
    }
    return d;
  }

  function renderPalette() {
    var pal = $('palette');
    pal.innerHTML = '';
    var placed = {};
    Object.keys(st.slots).forEach(function (k) { if (st.slots[k]) placed[st.slots[k]] = 1; });
    st.cur.cards.forEach(function (c) {
      if (placed[c.card_no]) return;
      var d = cardEl(c, false);
      if (st.selected === c.card_no) d.classList.add('selected');
      pal.appendChild(d);
    });
    $('palette-title').textContent = st.selected
      ? 'カードを選びました。置く頂点をタップしてください'
      : 'カード（ドラッグするか、タップして選び、頂点をタップ）';
  }

  function place(no, k) {
    var mode = st.cur.mode;
    TRI.slotKeys(mode).forEach(function (s) { if (st.slots[s] === no) st.slots[s] = 0; });
    st.slots[k] = no;
    st.selected = 0;
    st.step += 1;
    enqueue('SET', { slot_key: k, card: no, ans_str: ansStr() });
    renderStage();
    renderPalette();
  }

  function remove(k) {
    var no = st.slots[k];
    if (!no) return;
    st.slots[k] = 0;
    st.step += 1;
    enqueue('REMOVE', { slot_key: k, card: no, ans_str: ansStr() });
    renderStage();
    renderPalette();
  }

  function ansStr() {
    return TRI.slotKeys(st.cur.mode).map(function (k) { return st.slots[k] || 0; }).join(',');
  }

  // 結果の表示。スマホではこたえあわせのボタンの下に出るので、表示のたびにそこまでスクロールして見せる
  function setFeedback(html) {
    var fb = $('feedback');
    fb.innerHTML = html;
    if (fb.scrollIntoView) fb.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  }

  function renderFlags(flags, correct) {
    if (correct) {
      setFeedback('<div class="ok">論証として妥当です！</div>');
      return;
    }
    var html = '<div class="hint">もう一度考えてみよう</div>';
    FLAG_ORDER.forEach(function (k) {
      if (flags[k] !== undefined && !flags[k]) {
        html += '<div class="hint">・<b>' + FLAG_LABEL[k] + '</b>: ' + FLAG_HINT[k] + '</div>';
      }
    });
    setFeedback(html);
  }

  function check() {
    var mode = st.cur.mode;
    var empty = TRI.slotKeys(mode).some(function (k) { return !st.slots[k]; });
    if (empty) {
      setFeedback('<div class="hint">すべての頂点にカードを置いてください</div>');
      return;
    }
    st.trial += 1;
    $('btn-check').disabled = true;
    API.check(st.session, st.cur.lv, st.cur.asg, st.slots).then(function (r) {
      $('btn-check').disabled = false;
      if (!r || !r.ok) {
        if (r && r.code === 'auth') { logout(true); return; }
        setFeedback('<div class="err">' + ((r && r.error) || '評価結果が取得できませんでした') + '</div>');
        return;
      }
      var flags = {};
      ['p_s', 't_s', 'e_s', 'm_s', 'm_s_fact', 'm_s_w_obj', 'm_s_w_exc', 'm_s_w_rel', 'c_s', 'i_p_s', 'f_s'].forEach(function (k) {
        flags[k] = r.flags[k] ? 1 : 0;
      });
      enqueue('CHECK', Object.assign({ check_flag: 1, jdg: r.correct ? 's' : 'f', ans_str: ansStr() }, flags));
      renderFlags(r.flags, r.correct);
      if (r.correct) {
        var prog = progress();
        prog[pkey(st.cur)] = 1;
        lsSet(LS.progress, prog);
        enqueue('PROB_END', { jdg: 's', ans_str: ansStr() });
        flush();
      }
    });
  }

  function go(delta) {
    var n = st.idx + delta;
    if (n < 0 || n >= st.problems.length) return;
    openProblem(n);
  }

  function logout(silent) {
    if (st.session) enqueue('LOGOUT');
    flush();
    lsSet(LS.session, null);
    st.session = null;
    if (!silent) msg('ログアウトしました。');
    $('btn-logout').classList.add('hidden');
    $('who').textContent = '';
    show('view-login');
  }

  // ----- ログイン -----
  function onCredential(resp) {
    $('login-msg').textContent = '確認しています…';
    API.login(resp.credential).then(function (r) {
      if (!r || !r.ok) { $('login-msg').textContent = (r && r.error) || 'ログインできませんでした'; return; }
      lsSet(LS.session, r.session);
      enter(r);
      enqueue('LOGIN');
      flush();
    });
  }
  window.onGoogleCredential = onCredential;

  function enter(r) {
    st.session = r.session;
    st.email = r.email; st.userId = r.userId;
    st.problems = r.problems || [];
    st.version = r.problemsVersion || '';
    st.flushMs = r.flushMs || 5000; st.maxBatch = r.maxBatch || 100;
    $('login-msg').textContent = '';
    $('who').textContent = 'ログイン中：' + (r.registered ? (r.grade + '年 ' + r.cls + '組 ' + r.number + '番') : r.userId);
    $('btn-logout').classList.remove('hidden');
    renderLevels();
    startFlushing();
  }

  function resumeSaved() {
    var saved = lsGet(LS.session, null);
    if (!saved) return;
    API.resume(saved).then(function (r) {
      if (r && r.ok) enter(r);
      else if (r && r.code === 'auth') lsSet(LS.session, null);
      else msg((r && r.error) || '通信できませんでした。', true);
    });
  }

  function init() {
    // 読み込みごとに新しい接頭辞にする（seq は読み込みのたびに 1 から振るため、event_id の重複を避ける）
    st.pageSession = uuid();
    var c = cfg.clientId || '';
    if (c) {
      var g = $('g_id_onload');
      g.setAttribute('data-client_id', c);
      g.setAttribute('data-callback', 'onGoogleCredential');
    } else {
      $('login-msg').textContent = 'web/config.json の clientId が空です（ログインできません）。';
    }
    $('btn-prev').addEventListener('click', function () { go(-1); });
    $('btn-next').addEventListener('click', function () { go(1); });
    $('btn-check').addEventListener('click', check);
    $('btn-list').addEventListener('click', function () { renderLevels(); });
    $('btn-logout').addEventListener('click', function () { logout(false); });
    window.addEventListener('beforeunload', function () { flush(); });
    show('view-login');
    resumeSaved();
  }
  return { init: init, _st: st };
})();
document.addEventListener('DOMContentLoaded', function () { STU.init(); });
</script>
