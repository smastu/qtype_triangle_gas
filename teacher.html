var TRI = (function () {

  /** PHP の (int) に近い変換。null/undefined は既定値 d（PHP の ?? 1 に当たる） */

    if (v === null || v === undefined) return d;
    if (typeof v === 'boolean') return v ? 1 : 0;
    var n = parseInt(v, 10);
    return isNaN(n) ? 0 : n;
  }

  /** PHP の ($x ?? '') に当たる文字列化 */
  function str(v) {
    return v === null || v === undefined ? '' : String(v);
  }

  /**
   * 用語の正規化（constraint_evaluator::normalize_term）。
   * 空白（ASCII の空白類と全角空白）をすべて除き、前後の trim をする。
   */
  function normalizeTerm(s) {
    var t = str(s).replace(/[ \t\n\v\f\r　]+/g, '');
    return t.replace(/^[ \t\n\r\0\x0B]+|[ \t\n\r\0\x0B]+$/g, '');

  function slotKeys(mode) {
    return mode === 'compound' ? COMPOUND_SLOTS.slice() : SINGLE_SLOTS.slice();
  }

  /** card_no → card の表を作る（PHP __construct の cards_by_no） */

    var byNo = {};
    (cards || []).forEach(function (c) { byNo[toInt(c.card_no, 0)] = c; });

  }

  /** スロット連想配列 → 配置カードの解決（空・未知の番号は null）。PHP resolve_placed */

  function checkPropositionFormSingle(p) {

      && str(p.middle.proposition_form) === 'particular'
      && str(p.lower_fact.proposition_form) === 'particular'
      && str(p.upper_warrant.proposition_form) === 'general'
      && str(p.lower_warrant.proposition_form) === 'general';

  function checkTermSharingSingle(p) {

    if (!fact || !warrant) return false;

    if (!claim || !warrant) return false;

    return str(m.correct_slot) === 'middle';

    if (!m) return false;
    return str(m.proposition_form) === 'particular';

  /**
   * PHP constraint_evaluator::evaluate。
   * @param {string} mode 'single' | 'compound'

   * @param {Object} slots スロットキー → card_no（0 は空）

      p_s: toFlag(checkPropositionFormSingle(ps)),
      t_s: toFlag(checkTermSharingSingle(ps)),

    var keys = slotKeys(mode);

   * @param {Object} slots スロットキー → card_no

  return {
    login: function (idToken) { return call({ action: 'login', idToken: idToken }); },
    resume: function (session) { return call({ action: 'resume', session: session }); },
    check: function (session, lv, asg, slots) { return call({ action: 'check', session: session, lv: lv, asg: asg, slots: slots }); },
    log: function (session, events) { return call({ action: 'log', session: session, events: events }); },
    problemsLoad: function (session) { return call({ action: 'problems.load', session: session }); },
    problemsSave: function (session, problems, baseVersion) { return call({ action: 'problems.save', session: session, problems: problems, baseVersion: baseVersion }); },
    logsIndex: function (session) { return call({ action: 'logs.index', session: session }); },
    logsCsv: function (session, date, columns, withEmail) { return call({ action: 'logs.csv', session: session, date: date, columns: columns, withEmail: withEmail }); }
  };
})();
</script>

<div id="teacher">
  <header class="top">
    <h1>三角ロジック 教員用</h1>
    <div>
      <span id="t-who" class="status"></span>
      <button id="t-logout" class="ghost hidden" type="button">ログアウト</button>
    </div>
  </header>
  <div class="grass"></div>
  <main>
    <section id="t-login" class="panel">
      <p>教員のアカウントでログインしてください。</p>
      <div id="g_id_onload" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with" data-locale="ja"></div>
      <p id="t-login-msg" class="feedback"></p>
    </section>

    <section id="t-main" class="hidden">
      <div class="panel">
        <h2 style="margin:0 0 6px;font-size:17px;">問題セット（課題）</h2>
        <p class="status" style="color:var(--text);opacity:1">
          問題の JSON を編集し、「検査」で判定エンジンが全問の正解配置を確かめます。正解できない問題は保存できません。
          保存すると、学習者の画面に反映されます（版は <span id="t-version"></span>）。
        </p>
        <div class="bar">
          <button id="t-load" type="button">読み込み</button>
          <button id="t-check" type="button">検査</button>
          <button id="t-save" class="primary" type="button">保存</button>
          <button id="t-sample" type="button">サンプル問題を読み込む（125 問）</button>
        </div>
        <div class="bar" style="margin-top:8px">
          <label style="font-size:13px">生成：ジャンル <select id="t-genre"></select></label>
          <label style="font-size:13px">形式 <select id="t-gen-mode"><option value="single">単一</option><option value="compound">複合</option></select></label>
          <label style="font-size:13px">レベル <input id="t-gen-lv" type="number" value="1" min="1" max="9" style="width:60px"></label>
          <label style="font-size:13px">件数 <input id="t-gen-n" type="number" value="2" min="1" max="10" style="width:60px"></label>
          <label style="font-size:13px">乱数の種 <input id="t-gen-seed" type="number" value="1" style="width:90px"></label>
          <button id="t-gen" type="button">seed から生成（追加）</button>
        </div>
        <textarea id="t-json" rows="18" style="width:100%;font-family:monospace;font-size:12px;margin-top:8px"></textarea>
        <div id="t-report" class="feedback"></div>
      </div>

      <div class="panel">
        <h2 style="margin:0 0 6px;font-size:17px;">ログの書き出し（CSV）</h2>
        <div class="bar">
          <button id="t-logs" type="button">日ごとのログを確認</button>
          <label style="font-size:13px"><input id="t-with-email" type="checkbox"> メールを付ける（名簿の対応を使う）</label>
        </div>
        <div id="t-days" class="feedback"></div>
      </div>
      <p id="t-msg" class="feedback"></p>
    </section>
  </main>
</div>

<script>
// 教員用画面。課題（問題）の編集・検査・保存と、ログの CSV 書き出し。
var TEACHER = (function () {
  var LS = { session: 'tri_teacher_session' };
  var cfg = (typeof MSK_CONFIG !== 'undefined') ? MSK_CONFIG : {};
  var st = { session: null, version: '', problems: [] };
  function $(id) { return document.getElementById(id); }
  function msg(t, err) { $('t-msg').textContent = t || ''; $('t-msg').style.color = err ? '#ffd0d0' : ''; }

  function showMain(on) {
    $('t-main').classList.toggle('hidden', !on);
    $('t-login').classList.toggle('hidden', on);
    $('t-logout').classList.toggle('hidden', !on);
  }

  function parseEditor() {
    var text = $('t-json').value.trim();
    if (!text) return [];
    var arr = JSON.parse(text);
    if (!Array.isArray(arr)) throw new Error('問題の一覧（配列）にしてください');
    return arr;
  }

  // 判定エンジンでその場検査（サーバでも保存時に同じ検査をする）
  function checkLocal() {
    var list;
    try { list = parseEditor(); } catch (e) { $('t-report').innerHTML = '<span class="err">JSON が読めません：' + e.message + '</span>'; return null; }
    var lines = [];
    var okCount = 0;
    list.forEach(function (p) {
      var name = 'レベル' + p.lv + '-' + p.asg + ' ' + (p.name || '');
      try {
        var correct = TRI.correctSlots(p);
        if (!TRI.isComplete(p.mode, correct)) { lines.push('・' + name + '：正解のカードがそろっていない'); return; }
        var j = TRI.judge(p, correct);
        if (j.ok) { okCount++; return; }
        var bad = TRI.FLAG_ORDER.filter(function (k) { return j.flags[k] !== undefined && !j.flags[k]; });
        lines.push('・' + name + '：正解の配置が満たさない制約 ' + (bad.join(', ') || '（順序）'));
      } catch (e) { lines.push('・' + name + '：' + e.message); }
    });
    $('t-report').innerHTML = '<div class="ok">正解できる問題：' + okCount + ' / ' + list.length + '</div>'
      + lines.map(function (l) { return '<div class="err">' + l.replace(/</g, '&lt;') + '</div>'; }).join('');
    return list;
  }

  function load() {
    API.problemsLoad(st.session).then(function (r) {
      if (!r || !r.ok) { if (r && r.code === 'auth') logout(); msg((r && r.error) || '読み込めませんでした', true); return; }
      st.version = r.version || '';
      $('t-version').textContent = st.version || '（まだ保存されていません）';
      st.problems = r.problems || [];
      $('t-json').value = JSON.stringify(st.problems, null, 1);
      checkLocal();
      msg('読み込みました。');
    });
  }

  function save() {
    var list = checkLocal();
    if (!list) return;
    API.problemsSave(st.session, list, st.version).then(function (r) {
      if (!r || !r.ok) {
        msg((r && r.error) || '保存できませんでした', true);
        if (r && r.code === 'auth') logout();
        return;
      }
      st.version = r.version;
      $('t-version').textContent = r.version || '（空：学習者の問題はありません）';
      msg('保存しました（' + r.count + ' 問）。');
    });
  }

  function logsIndex() {
    API.logsIndex(st.session).then(function (r) {
      if (!r || !r.ok) { msg((r && r.error) || '一覧を取得できませんでした', true); return; }
      var box = $('t-days');
      box.innerHTML = '';
      if (!r.days.length) { box.textContent = 'まだログはありません。'; return; }
      r.days.forEach(function (d) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = d.date + '（' + d.rows + ' 行）CSV';
        b.addEventListener('click', function () { downloadCsv(d.date); });
        box.appendChild(b);
        box.appendChild(document.createTextNode(' '));
      });
    });
  }

  function downloadCsv(date) {
    API.logsCsv(st.session, date, 'all', $('t-with-email').checked).then(function (r) {
      if (!r || !r.ok) { msg((r && r.error) || '書き出せませんでした', true); return; }
      var blob = new Blob(['﻿' + r.csv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'triangle_log_' + date + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      msg(date + ' の CSV（' + r.rows + ' 行）を書き出しました。');
    });
  }

  function logout() {
    lsSet(null);
    st.session = null;
    showMain(false);
    $('t-who').textContent = '';
  }
  function lsSet(v) { try { localStorage.setItem(LS.session, JSON.stringify(v)); } catch (e) { /* 諦める */ } }
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS.session)); } catch (e) { return null; } }

  function enter(r) {
    if (!r.isTeacher) {
      $('t-login-msg').textContent = 'このアカウントは教員として登録されていません（' + r.email + '）';
      lsSet(null);
      return;
    }
    st.session = r.session;
    lsSet(r.session);
    $('t-who').textContent = '教員：' + r.email;
    showMain(true);
    fillGenres();
    load();
  }

  function onCredential(resp) {
    $('t-login-msg').textContent = '確認しています…';
    API.login(resp.credential).then(function (r) {
      if (!r || !r.ok) { $('t-login-msg').textContent = (r && r.error) || 'ログインできませんでした'; return; }
      enter(r);
    });
  }
  window.onTeacherCredential = onCredential;

  function fillGenres() {
    // 生成器の語彙（seed）が読み込まれていれば、ジャンルを並べる
    var sel = $('t-genre');
    sel.innerHTML = '';
    var none = document.createElement('option'); none.value = ''; none.textContent = '（自動で選ぶ）'; sel.appendChild(none);
    if (typeof TRI_SEEDS === 'undefined') return;
    Object.keys(TRI_SEEDS).forEach(function (g) {
      var o = document.createElement('option'); o.value = g; o.textContent = g; sel.appendChild(o);
    });
  }

  // 生成：語彙（seed）から、正解が 1 通りに決まる問題を作る（生成器が一意性を確かめる）。保存は別。
  function generate() {
    if (typeof TRI_GEN === 'undefined' || typeof TRI_SEEDS === 'undefined') { msg('生成器が読み込まれていません', true); return; }
    var list = [];
    try { list = parseEditor(); } catch (e) { msg('JSON を直してから生成してください', true); return; }
    var lib = Object.keys(TRI_SEEDS).map(function (k) { return TRI_SEEDS[k]; });
    var n = Math.max(1, Math.min(10, parseInt($('t-gen-n').value, 10) || 1));
    var seed = parseInt($('t-gen-seed').value, 10) || 1;
    var lv = Math.max(1, Math.min(9, parseInt($('t-gen-lv').value, 10) || 1));
    var mode = $('t-gen-mode').value;
    var genre = $('t-genre').value;
    var asg = 1;
    list.forEach(function (p) { if (p.lv === lv && p.asg >= asg) asg = p.asg + 1; });
    var made = 0, failed = 0, lastErr = '';
    for (var i = 0; i < n; i++) {
      try {
        var p = TRI_GEN.generateFromLibrary({ library: lib, genre: genre, mode: mode, seed: seed + i, dummy_count: 3 });
        list.push({ lv: lv, asg: asg++, name: p.name, mode: p.mode, topic: p.topic || '',
          order_required: p.order_required ? 1 : 0, questiontext: p.questiontext || '',
          note: '生成（seed ' + (seed + i) + '）', cards: p.cards });
        made++;
      } catch (e) { failed++; lastErr = e.message; }
    }
    $('t-json').value = JSON.stringify(list, null, 1);
    checkLocal();
    msg(made + ' 問を追加しました' + (failed ? '（' + failed + ' 問は作れず：' + lastErr + '）' : '') + '。保存するまで反映されません。');
  }

  function loadSample() {
    if (typeof MSK_SAMPLE === 'undefined') { msg('サンプルが読み込まれていません', true); return; }
    $('t-json').value = JSON.stringify(MSK_SAMPLE, null, 1);
    checkLocal();
    msg('サンプル ' + MSK_SAMPLE.length + ' 問を読み込みました（保存するまで反映されません）。');
  }

  function init() {
    var c = cfg.clientId || '';
    if (c) {
      var g = $('g_id_onload');
      g.setAttribute('data-client_id', c);
      g.setAttribute('data-callback', 'onTeacherCredential');
    } else {
      $('t-login-msg').textContent = 'web/config.json の clientId が空です。';
    }
    $('t-load').addEventListener('click', load);
    $('t-check').addEventListener('click', checkLocal);
    $('t-save').addEventListener('click', save);
    $('t-gen').addEventListener('click', generate);
    $('t-sample').addEventListener('click', loadSample);
    $('t-logs').addEventListener('click', logsIndex);
    $('t-logout').addEventListener('click', logout);
    var saved = lsGet();
    if (saved) API.resume(saved).then(function (r) { if (r && r.ok) enter(r); else lsSet(null); });
  }
  return { init: init };
})();
document.addEventListener('DOMContentLoaded', function () { TEACHER.init(); });
</script>
